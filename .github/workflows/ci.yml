name: ci

# A first job (`changes`) works out what the commit touched; the others run
# only when needed. PRs: pin check + acceptance suite. Push to main with image
# changes: also publish, sign, attest and publish the Template. A templates/-only
# push publishes just the Template. Nothing is pushed unless acceptance passes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild (as a push to main: test, publish, sign) so OS security
  # patches reach the image without a code change.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/valerid/dev-setup/node
  # The Template lives under its own name so it never shares a tag with the image.
  TEMPLATE_NAMESPACE: valerid/dev-setup/templates
  # Add linux/arm64 here (and a QEMU step) once it is verified to build.
  PLATFORM: linux/amd64
  CLI_VERSION: 0.89.0
  TEST_IMAGE: dev-setup-node:ci

jobs:
  # Decides what runs. Path groups: image = what goes into the image;
  # tests = what the acceptance suite or CI itself reads; template = templates/.
  # schedule, workflow_dispatch, a missing/all-zero `before` and an unreachable
  # base (force push) count as everything changed.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.diff.outputs.image }}
      tests: ${{ steps.diff.outputs.tests }}
      template: ${{ steps.diff.outputs.template }}
      publish_image: ${{ steps.diff.outputs.publish_image }}
      publish_template_only: ${{ steps.diff.outputs.publish_template_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with the base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          everything=false
          base=""
          case "$EVENT_NAME" in
            pull_request) base=$(git merge-base "origin/${BASE_REF}" HEAD) || base="" ;;
            push) base="$BEFORE" ;;
          esac
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            everything=true
          elif ! files=$(git diff --name-only "$base" HEAD); then
            everything=true
          fi

          image=false tests=false template=false
          if [ "$everything" = true ]; then
            image=true tests=true template=true
          else
            echo "changed files:"; echo "$files"
            grep -Eq '^(base|installer|extensions|variants/node)/' <<<"$files" && image=true
            grep -Eq '^(tests/|templates/|skills/dev-container/|package\.json$|\.github/|renovate\.json$)' <<<"$files" && tests=true
            grep -Eq '^templates/' <<<"$files" && template=true
          fi

          on_main=false
          [ "$EVENT_NAME" != pull_request ] && [ "$REF" = refs/heads/main ] && on_main=true
          publish_image=false publish_template_only=false
          [ "$on_main" = true ] && [ "$image" = true ] && publish_image=true
          [ "$on_main" = true ] && [ "$image" = false ] && [ "$template" = true ] && publish_template_only=true

          {
            echo "image=$image"
            echo "tests=$tests"
            echo "template=$template"
            echo "publish_image=$publish_image"
            echo "publish_template_only=$publish_template_only"
          } | tee -a "${GITHUB_OUTPUT:-/dev/null}"

  pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/check-pins.mjs
      - run: node --test tests/pins.test.mjs
      # Installer tests use local fixtures; only its two pinned deps come from the registry.
      - run: npx -y pnpm@11.0.0 install --frozen-lockfile
        working-directory: installer
      - run: npm run test:installer
      # dev-container skill helper: temp dirs only, no Docker.
      - run: npx -y pnpm@11.0.0 install --frozen-lockfile
        working-directory: skills/dev-container/scripts
      - run: npm run test:skill

  # Builds the image once, runs the acceptance suite against exactly that
  # image, and hands the same image to the publish job as a tarball.
  acceptance:
    needs: changes
    if: needs.changes.outputs.image == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.template == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build image (loaded into the local daemon)
        env:
          DEV_SETUP_REVISION: ${{ github.sha }}  # image label org.opencontainers.image.revision
        run: |
          npx -y "@devcontainers/cli@${CLI_VERSION}" build \
            --workspace-folder variants/node \
            --config variants/node/devcontainer.json \
            --platform "$PLATFORM" \
            --image-name "$TEST_IMAGE"
      - name: Host deps for the skill helper test
        run: |
          (cd installer && npx -y pnpm@11.0.0 install --frozen-lockfile)
          (cd skills/dev-container/scripts && npx -y pnpm@11.0.0 install --frozen-lockfile)
      - name: Acceptance suite
        env:
          DEV_SETUP_TEST_IMAGE: ${{ env.TEST_IMAGE }}
          DEV_SETUP_TEST_SKIP_BUILD: "1"
        run: npm test
      - name: Save the tested image
        if: needs.changes.outputs.publish_image == 'true'
        run: docker save "$TEST_IMAGE" | gzip > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.publish_image == 'true'
        with:
          name: tested-image
          path: image.tar.gz
          retention-days: 1

  publish:
    needs: [changes, pins, acceptance]
    # publish_image is main-only and set only for image changes, the schedule
    # or a manual run: verify-image accepts signatures from ci.yml on
    # refs/heads/main, so a run on another branch must not move :latest.
    if: >-
      !cancelled() && needs.changes.outputs.publish_image == 'true'
      && needs.pins.result == 'success' && needs.acceptance.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write     # cosign keyless and attestations
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Tag and push the tested image
        run: |
          gunzip -c image.tar.gz | docker load
          docker tag "$TEST_IMAGE" "${IMAGE}:sha-${GITHUB_SHA::12}"
          docker tag "$TEST_IMAGE" "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${GITHUB_SHA::12}"
          docker push "${IMAGE}:latest"

      - name: Resolve digest
        id: digest
        run: |
          d=$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA::12}" --format '{{.Manifest.Digest}}')
          # the registry must hold the loaded image we tested
          docker image inspect "$TEST_IMAGE" --format '{{json .RepoDigests}}' | grep -q "$d" || { echo "digest $d not found locally"; exit 1; }
          [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: $d"; exit 1; }
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      - name: Sign (cosign keyless)
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      # push-to-registry stores the attestations next to the image so a host
      # can run `cosign verify-attestation` without the gh CLI.
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Verify what was just pushed
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${REPO}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$REPO"

  # Publishes the Template. After `publish` it points at the digest just
  # published; on a templates/-only change it points at the image now at
  # `latest`, after cosign verifies it. Signs nothing.
  template:
    needs: [changes, pins, acceptance, publish]
    if: >-
      !cancelled() && needs.pins.result == 'success' && needs.acceptance.result == 'success'
      && ((needs.changes.outputs.publish_image == 'true' && needs.publish.result == 'success')
          || needs.changes.outputs.publish_template_only == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs.changes.outputs.publish_template_only == 'true'
      - name: Resolve the image digest
        id: image
        env:
          TEMPLATE_ONLY: ${{ needs.changes.outputs.publish_template_only }}
          PUBLISHED: ${{ needs.publish.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$TEMPLATE_ONLY" = true ]; then
            d=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: $d"; exit 1; }
            # same identity the publish job checks; verifying needs no id-token
            cosign verify "${IMAGE}@${d}" \
              --certificate-identity-regexp "^https://github.com/${REPO}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          else
            d="$PUBLISHED"
          fi
          echo "digest=$d" >> "$GITHUB_OUTPUT"
      # The Template's `image` option default becomes the exact image digest,
      # so applying the Template pins the project to what CI verified.
      - name: Fill in image digest and bump version
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          f=templates/node/devcontainer-template.json
          jq --arg ref "${IMAGE}@${DIGEST}" --arg v "0.1.${GITHUB_RUN_NUMBER}" \
            '.options.image.default = $ref | .version = $v' "$f" > "$f.tmp"
          mv "$f.tmp" "$f"
          jq '{version, image: .options.image.default}' "$f"
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-templates: "true"
          base-path-to-templates: ./templates
          templates-namespace: ${{ env.TEMPLATE_NAMESPACE }}
          generate-docs: "false"
          disable-repo-tagging: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The skill reads the image through `node:latest`; it must still be the
      # image this Template points at, not a Template artifact.
      - name: Guard, latest is still the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          d=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')
          [ "$d" = "$DIGEST" ] || { echo "${IMAGE}:latest is $d, expected $DIGEST"; exit 1; }
