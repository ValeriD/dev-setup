# The Quarterdeck's Docker filter: the one place for the proxy pin and the allowed list.
# Read by quarterdeck/bin/quarterdeck (sourced; this repository's file, not user input) and by tests/quarterdeck.test.mjs.
# Anything not listed is refused by the proxy with 403. Each ALLOW_* value is a regex over the request path
# (an optional /vN.NN API version prefix, then the endpoint); '|' separates alternatives.
# exec/{id}/json is not in the design's list but `docker exec` fails without it (the CLI reads the exit code there).
# The proxy cannot see a container-create body (accepted gap, decision 10). Later tickets may add entries.

# wollomatic/socket-proxy, digest-pinned. Renovate updates the tag and digest together (renovate.json);
# scripts/check-pins.mjs fails when the digest is missing.
PROXY_IMAGE=wollomatic/socket-proxy:1.13.2@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848

API_PREFIX='^(/v[0-9.]+)?'
ALLOW_GET="$API_PREFIX/(_ping|version|info|containers/json|containers/[^/]+/json|exec/[^/]+/json|images/.+/json|volumes|events)\$"
ALLOW_POST="$API_PREFIX/(containers/create|containers/[^/]+/(start|stop|kill|wait)|containers/[^/]+/exec|exec/[^/]+/(start|resize)|images/create|build|volumes/create)\$"
ALLOW_DELETE="$API_PREFIX/containers/[^/]+\$"
